<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWS Work Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: 'Inter', sans-serif;
            --bs-primary-rgb: 13, 110, 253;
            --bs-secondary-rgb: 108, 117, 125;
            --bs-light-rgb: 248, 249, 250;
            --bs-dark-rgb: 33, 37, 41;
            --bs-body-bg-rgb: 240, 242, 245;
        }
        html[data-bs-theme="dark"] {
            --bs-body-bg-rgb: 18, 18, 18;
            --bs-light-rgb: 33, 37, 41;
            --bs-dark-rgb: 248, 249, 250;
        }
        body { background-color: rgb(var(--bs-body-bg-rgb)); transition: background-color 0.3s ease; }
        .navbar, .card, .accordion-button, .accordion-body, .form-control { transition: all 0.3s ease; }
        .card { border: none; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        html[data-bs-theme="dark"] .card { box-shadow: 0 4px 12px rgba(0,0,0,.3); }
        .btn-float {
            position: fixed; bottom: 20px; right: 20px; z-index: 1030;
            box-shadow: 0 4px 12px rgba(0,0,0,.2);
        }
        #google_translate_element { padding: 0.5rem; }
        .goog-te-gadget-simple { background-color: transparent !important; border: none !important; }
        .goog-te-gadget-icon { display: none !important; }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; }
            .card { box-shadow: none; border: 1px solid #dee2e6; }
            .accordion-button, .accordion-collapse { display: block !important; }
            .accordion-button::after { display: none; }
            .accordion-body { padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-body-tertiary">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top no-print">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}"><i class="bi bi-gear-wide-connected"></i> RWS Manager</a>
            <div class="d-flex align-items-center">
                <div id="google_translate_element"></div>
                <button class="btn btn-outline-light ms-2" id="theme-toggler" type="button">
                    <i class="bi bi-sun-fill"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>
    
    <a href="{% url 'add_work' %}" class="btn btn-primary btn-lg rounded-circle btn-float no-print" title="Add New Work">
        <i class="bi bi-plus-lg"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript">
        // --- Dark/Light Mode Toggler ---
        const themeToggler = document.getElementById('theme-toggler');
        const getPreferredTheme = () => localStorage.getItem('theme') || 'light';
        const setTema = (theme) => {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggler.querySelector('i').className = theme === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        };
        setTema(getPreferredTheme());
        themeToggler.addEventListener('click', () => {
            const currentTheme = getPreferredTheme();
            setTema(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // --- Google Translate Widget ---
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
